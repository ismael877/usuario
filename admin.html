<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - VideoPay</title>
    <!-- Agrega los estilos de FirebaseUI y los tuyos propios -->
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a; color: #f1f5f9; font-family: system-ui, -apple-system, sans-serif;
            padding: 24px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .login-box { max-width: 400px; margin: 100px auto; background: #1e293b; padding: 32px; border-radius: 24px; text-align: center; }
        input, button {
            width: 100%; padding: 12px; margin-top: 12px; border-radius: 12px; border: none;
            font-size: 16px;
        }
        input { background: #0f172a; color: white; }
        button { background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #2563eb; }
        .error { color: #f87171; margin-top: 12px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; flex-wrap: wrap; gap: 16px; }
        .stats-grid { display: flex; gap: 20px; margin-bottom: 32px; flex-wrap: wrap; }
        .stat-card { background: #1e293b; padding: 20px; border-radius: 20px; flex: 1; min-width: 150px; text-align: center; }
        .stat-number { font-size: 32px; font-weight: bold; color: #facc15; }
        .user-table { background: #1e293b; border-radius: 20px; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; font-weight: 600; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .logout-btn { background: #ef4444; margin-top: 0; width: auto; padding: 8px 16px; }
        .logout-btn:hover { background: #dc2626; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <!-- Aquí se mostrará el login o el dashboard -->
    </div>

    <script type="module">
        // 1. CONFIGURACIÓN DE FIREBASE (USA LA MISMA QUE EN TU APP)
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js';
        import { getFirestore, collection, getDocs, query, orderBy, limit } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyCiN9CscYBtqJcdoh33RUMV_mamld1he8I",
            authDomain: "videopay-c9d54.firebaseapp.com",
            projectId: "videopay-c9d54",
            storageBucket: "videopay-c9d54.firebasestorage.app",
            messagingSenderId: "356964325923",
            appId: "1:356964325923:web:5364b2151d2e9e8a46af96",
            measurementId: "G-WB53DC82H7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // --- CREDENCIALES DEL ADMIN (CÁMBIALAS) ---
        const ADMIN_EMAIL = "admin@videopay.com";
        const ADMIN_PASSWORD = "Admin123!";

        const appDiv = document.getElementById('app');

        // Función para mostrar el login
        function showLogin() {
            appDiv.innerHTML = `
                <div class="login-box">
                    <h2>🔐 Panel de Control</h2>
                    <input type="email" id="email" placeholder="Correo electrónico" value="${ADMIN_EMAIL}">
                    <input type="password" id="password" placeholder="Contraseña">
                    <button id="loginButton">Iniciar Sesión</button>
                    <div id="errorMsg" class="error"></div>
                </div>
            `;
            document.getElementById('loginButton').addEventListener('click', async () => {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                try {
                    await signInWithEmailAndPassword(auth, email, password);
                    // El onAuthStateChanged se encargará de cambiar la vista
                } catch (error) {
                    document.getElementById('errorMsg').innerText = "Error: Credenciales incorrectas.";
                }
            });
        }

        // Función para mostrar el dashboard
        async function showDashboard(user) {
            appDiv.innerHTML = `
                <div class="dashboard-header">
                    <h1>📊 Panel de Administración</h1>
                    <button id="logoutBtn" class="logout-btn">Cerrar Sesión</button>
                </div>
                <div class="stats-grid" id="statsGrid">
                    <div class="stat-card"><div class="stat-number" id="totalUsers">0</div><div>Usuarios Registrados</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalVideos">0</div><div>Videos Subidos</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalMB">0</div><div>Megas Totales</div></div>
                    <div class="stat-card"><div class="stat-number" id="totalEarnings">RD$0</div><div>Ganancias Generadas</div></div>
                </div>
                <div class="user-table">
                    <table>
                        <thead>
                            <tr><th>Usuario</th><th>Email</th><th>Videos</th><th>Megas</th><th>Ganancias</th></tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr><td colspan="5">Cargando usuarios...</td></tr>
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));
            await loadAdminData(); // Función para cargar todos los datos
        }

        async function loadAdminData() {
            const usersRef = collection(db, 'users');
            const usersSnapshot = await getDocs(usersRef);
            
            let totalUsers = 0, totalVideos = 0, totalMB = 0, totalEarnings = 0;
            const tableBody = document.getElementById('usersTableBody');
            tableBody.innerHTML = ''; // Limpiar tabla

            for (const userDoc of usersSnapshot.docs) {
                totalUsers++;
                const userData = userDoc.data();
                const userVideosRef = collection(db, 'users', userDoc.id, 'videos');
                const videosSnapshot = await getDocs(userVideosRef);
                
                let userVideosCount = 0, userMB = 0, userEarnings = 0;
                videosSnapshot.forEach(videoDoc => {
                    const video = videoDoc.data();
                    userVideosCount++;
                    userMB += video.sizeMB || 0;
                    userEarnings += video.earnings || 0;
                });

                totalVideos += userVideosCount;
                totalMB += userMB;
                totalEarnings += userEarnings;

                // Añadir fila a la tabla
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td><div style="display:flex; align-items:center; gap:8px"><img src="${userData.photo || ''}" class="user-avatar" onerror="this.src='https://ui-avatars.com/api/?name=${userData.name}'"> ${userData.name || 'N/A'}</div></td>
                    <td>${userData.email || 'N/A'}</td>
                    <td>${userVideosCount}</td>
                    <td>${userMB.toFixed(2)} MB</td>
                    <td>RD$ ${userEarnings.toFixed(2)}</td>
                `;
            }

            // Actualizar estadísticas generales
            document.getElementById('totalUsers').innerText = totalUsers;
            document.getElementById('totalVideos').innerText = totalVideos;
            document.getElementById('totalMB').innerText = totalMB.toFixed(2);
            document.getElementById('totalEarnings').innerText = 'RD$ ' + totalEarnings.toFixed(2);
        }

        // --- VERIFICAR ESTADO DE AUTENTICACIÓN ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                // Si el usuario logueado es el admin, muestra el dashboard
                if (user.email === ADMIN_EMAIL) {
                    await showDashboard(user);
                } else {
                    // Si no es el admin, cerrar sesión y mostrar login
                    await signOut(auth);
                    showLogin();
                    alert("Acceso no autorizado.");
                }
            } else {
                showLogin();
            }
        });
    </script>
</body>
</html>
